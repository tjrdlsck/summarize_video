<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Analyst - Insight Player</title>

    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Axios (HTTP Client) -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <!-- Custom Style -->
    <style>
        /* 기본 스크롤바 스타일링 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c7c7c7;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .highlight-hover:hover {
            background-color: #f0f9ff;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Sticky Video Wrapper */
        .video-sticky-wrapper {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: black;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* [추가] 블로그 모드용 타이포그래피 */
        .prose-custom {
            line-height: 1.8;
            /* 줄 간격을 넓혀서 읽기 편하게 */
            letter-spacing: -0.01em;
            word-break: keep-all;
            /* 한글 단어 끊김 방지 */
            text-align: justify;
            /* 양쪽 정렬 */
        }

        /* Markdown Custom Styles */
        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1f2937;
            /* Gray-800 */
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .markdown-body p {
            margin-bottom: 1rem;
            line-height: 1.75;
            color: #374151;
            /* Gray-700 */
        }

        /* [New] Inline Timestamp Style */
        .timestamp-link {
            display: inline-flex;
            align-items: center;
            gap: 4px;
            background-color: #f3f4f6; /* Gray-100 */
            color: #4f46e5; /* Indigo-600 */
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
            font-size: 0.75rem;
            font-weight: 700;
            padding: 2px 6px;
            border-radius: 6px;
            margin-right: 6px;
            cursor: pointer;
            transition: all 0.2s;
            border: 1px solid #e5e7eb;
            vertical-align: middle;
            user-select: none;
        }

        .timestamp-link:hover {
            background-color: #4f46e5;
            color: white;
            border-color: #4f46e5;
            transform: translateY(-1px);
            box-shadow: 0 2px 4px rgba(79, 70, 229, 0.2);
        }

        .timestamp-link::before {
            content: '▶';
            font-size: 0.6rem;
        }

        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .markdown-body li {
            margin-bottom: 0.5rem;
        }

        .markdown-body blockquote {
            border-left: 4px solid #6366f1;
            /* Indigo-500 */
            background-color: #f9fafb;
            padding: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: #4b5563;
        }

        .markdown-body strong {
            color: #4f46e5;
            /* Indigo-600 */
            font-weight: 700;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // [New] 시간 포맷 유틸리티 (초 -> HH:MM:SS.mmm)
        const formatTimeDetail = (seconds) => {
            if (isNaN(seconds) || seconds < 0) return "00:00:00.000";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            const ms = Math.floor((seconds - Math.floor(seconds)) * 1000);

            const hStr = String(h).padStart(2, '0');
            const mStr = String(m).padStart(2, '0');
            const sStr = String(s).padStart(2, '0');
            const msStr = String(ms).padStart(3, '0');

            return `${hStr}:${mStr}:${sStr}.${msStr}`;
        };

        // [Add] 문장 부호 제거 유틸리티 (., ?, !, ,)
        const removePunctuation = (text) => {
            if (!text) return "";
            return text.replace(/[.,?!]/g, "");
        };

        // [Add] 레거시 데이터(과거 분석 기록) 제목 정규화 유틸리티
        // 백엔드 패치 이전에 생성된 데이터의 제목(.mp4, _ 포함)을 UI에서 즉시 교정하여 보여줍니다.
        const normalizeLegacyTitle = (title) => {
            if (!title) return "제목 없음";

            // 이미 깔끔한 경우(확장자 없고, 언더스코어 없고, UUID 패턴도 없는 경우)는 패스
            // (UUID 패턴 검사는 복잡하므로, 아래 로직을 항상 타게 해도 무방합니다)

            let clean = title;

            // 1. [New] UUID 접두사 제거 (8자리 hex + _)
            // 정규식: 시작(^)에서 16진수 8자리와 _를 찾아서 빈 문자열로 치환
            clean = clean.replace(/^[0-9a-fA-F]{8}_/, "");

            // 2. 확장자 제거
            clean = clean.replace(/\.[^/.]+$/, "");

            // 3. 언더스코어를 공백으로 치환
            clean = clean.replace(/_/g, " ");

            // 4. 양쪽 공백 제거
            return clean.trim();
        };

        const { useState, useRef, useEffect, useMemo } = React;

        // --- [Sub Component] Task Monitor Widget (Upgraded v2) ---
        function TaskMonitor({ tasks, onCancel }) { // [Modify] onCancel prop 추가
            if (!tasks || tasks.length === 0) return null;

            return (
                <div className="fixed bottom-6 right-6 w-96 bg-white rounded-xl shadow-2xl border border-indigo-100 overflow-hidden z-50 fade-in flex flex-col max-h-[80vh]">
                    <div className="bg-indigo-600 px-4 py-3 flex justify-between items-center shrink-0">
                        <h3 className="text-white font-bold text-sm flex items-center gap-2">
                            <span className="animate-spin h-3 w-3 border-2 border-white border-t-transparent rounded-full"></span>
                            작업 대기열 ({tasks.length})
                        </h3>
                        <span className="text-xs text-indigo-200">자동 갱신 중</span>
                    </div>

                    <div className="overflow-y-auto p-4 space-y-4 custom-scrollbar">
                        {tasks.map((task, index) => {
                            // 상태별 스타일링 계산
                            let statusColor = "bg-indigo-500";
                            let statusText = `${task.progress}%`;
                            let isCancelable = true;

                            if (task.status === 'queued') {
                                statusColor = "bg-gray-300"; // 대기 중은 회색
                                statusText = "대기 중";
                            } else if (task.status === 'canceling') {
                                statusColor = "bg-red-400";
                                statusText = "중단 중...";
                                isCancelable = false;
                            } else if (task.status === 'failed') {
                                statusColor = "bg-red-500";
                                statusText = "오류/취소";
                                isCancelable = false;
                            } else if (task.status === 'completed') {
                                statusColor = "bg-green-500";
                                statusText = "완료";
                                isCancelable = false;
                            }

                            return (
                                <div key={task.task_id} className="text-sm border-b border-gray-100 last:border-0 pb-3 last:pb-0 relative group">
                                    <div className="flex justify-between text-gray-700 mb-1 items-center">
                                        <div className="flex flex-col w-2/3">
                                            <span className="font-bold truncate" title={task.filename}>
                                                {index + 1}. {normalizeLegacyTitle(task.filename)}
                                            </span>
                                            <span className="text-xs text-gray-400">
                                                {task.type === 'clip_export' ? '✂️ 클립 생성' : '🤖 영상 분석'}
                                            </span>
                                        </div>

                                        {/* 취소 버튼 (대기 중 or 진행 중일 때만 표시) */}
                                        {isCancelable && (
                                            <button
                                                onClick={() => onCancel(task.task_id)}
                                                className="text-xs bg-white border border-red-200 text-red-500 px-2 py-0.5 rounded hover:bg-red-50 transition"
                                            >
                                                중단
                                            </button>
                                        )}
                                    </div>

                                    {/* Progress Bar Container */}
                                    <div className="w-full bg-gray-100 rounded-full h-2 mb-1.5 overflow-hidden">
                                        {task.status === 'queued' ? (
                                            // 대기 중일 때: 빗금 패턴 애니메이션
                                            <div className="h-full w-full bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzjwqgAA6gJwww==')] opacity-30"></div>
                                        ) : (
                                            // 진행 중일 때: 실제 진행률
                                            <div
                                                className={`h-2 rounded-full transition-all duration-500 ${statusColor}`}
                                                style={{ width: `${task.progress}%` }}>
                                            </div>
                                        )}
                                    </div>

                                    <div className="flex justify-between items-center text-xs">
                                        <p className="text-gray-500 truncate w-3/4">
                                            {task.status === 'queued'
                                                ? `대기 순번: ${index + 1}번째`
                                                : task.message}
                                        </p>
                                        <span className={`font-bold ${task.status === 'failed' ? 'text-red-500' : 'text-indigo-600'}`}>
                                            {statusText}
                                        </span>
                                    </div>

                                    {/* 완료 시 다운로드 버튼 */}
                                    {task.status === 'completed' && task.type === 'clip_export' && task.result && (
                                        <div className="mt-1 text-right">
                                            <a
                                                href={task.result.download_url}
                                                className="inline-block text-xs bg-green-500 text-white px-2 py-1 rounded hover:bg-green-600 transition font-bold no-underline"
                                                download>
                                                ⬇ 다운로드
                                            </a>
                                        </div>
                                    )}
                                </div>
                            );
                        })}
                    </div>
                </div>
            );
        }

        // [New] 구간 시각화 컴포넌트 (타임라인 바)
        const TimelineVisualizer = ({ totalDuration, start, end }) => {
            if (!totalDuration) return null;

            // 퍼센트 계산 (0~100%)
            const startPct = Math.min(100, Math.max(0, (start / totalDuration) * 100));
            const endPct = Math.min(100, Math.max(0, (end / totalDuration) * 100));
            const widthPct = endPct - startPct;

            return (
                <div className="w-full mt-3 mb-1 px-1">
                    <div className="flex justify-between text-xs text-gray-400 mb-1 font-mono">
                        <span>0:00</span>
                        <span>{formatTimeDetail(totalDuration).split('.')[0]}</span>
                    </div>
                    {/* 트랙 배경 */}
                    <div className="relative w-full h-4 bg-gray-200 rounded-full overflow-hidden shadow-inner">
                        {/* 현재 구간 하이라이트 */}
                        <div
                            className="absolute top-0 h-full bg-indigo-500 opacity-80 transition-all duration-300 ease-out"
                            style={{ left: `${startPct}%`, width: `${widthPct}%` }}
                        ></div>
                    </div>
                    {/* 텍스트 정보 */}
                    <div className="text-center mt-1">
                        <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">
                            선택 구간: {((end - start) || 0).toFixed(1)}초
                        </span>
                    </div>
                </div>
            );
        };

        // --- [Main Application] ---
        function App() {
            // View Mode: 'dashboard' | 'player'
            const [viewMode, setViewMode] = useState('dashboard');

            // Data State
            const [urlInput, setUrlInput] = useState("");
            const [titleInput, setTitleInput] = useState(""); // [New] 대시보드용 제목 입력
            const [historyList, setHistoryList] = useState([]);
            const [activeTasks, setActiveTasks] = useState([]);
            const [playerData, setPlayerData] = useState(null);

            // Player UI State
            const [loading, setLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('chapters');
            // --- [Start] Accordion Logic ---
            // 챕터별 열림/닫힘 상태를 관리하는 State
            const [expandedChapters, setExpandedChapters] = useState({});

            // 데이터가 로드되면 기본적으로 모든 챕터를 '펼침(true)' 상태로 초기화
            useEffect(() => {
                if (playerData && playerData.chapters) {
                    const initialStates = {};
                    playerData.chapters.forEach((_, index) => {
                        initialStates[index] = true;
                    });
                    setExpandedChapters(initialStates);
                }
            }, [playerData]);

            // 개별 챕터 토글 함수
            const toggleChapter = (index) => {
                setExpandedChapters(prev => ({
                    ...prev,
                    [index]: !prev[index]
                }));
            };

            // 전체 펼치기/접기 제어 함수
            const setAllChapters = (isExpanded) => {
                if (!playerData || !playerData.chapters) return;
                const newStates = {};
                playerData.chapters.forEach((_, index) => {
                    newStates[index] = isExpanded;
                });
                setExpandedChapters(newStates);
            };
            // --- [End] Accordion Logic ---
            const [isEditingTitle, setIsEditingTitle] = useState(false); // [New] 제목 수정 모드
            const [editTitleText, setEditTitleText] = useState("");      // [New] 수정 중인 제목 텍스트
            const [showSubtitle, setShowSubtitle] = useState(true);      // [New] 자막 토글 상태
            const [currentSubtitle, setCurrentSubtitle] = useState(""); // [New] 커스텀 자막 텍스트 상태
            // [New] 컨트롤 바 표시 여부 감지용 상태 및 타이머 Ref
            const [isControlsVisible, setIsControlsVisible] = useState(false);
            const controlsTimeoutRef = useRef(null);
            // --- [New] Clip Editor State ---
            const [isClipMode, setIsClipMode] = useState(false); // 편집 모드 토글
            const [clipStart, setClipStart] = useState(0);       // 구간 시작 (초)
            const [clipEnd, setClipEnd] = useState(0);           // 구간 종료 (초)
            const [isExporting, setIsExporting] = useState(false); // 내보내기 로딩 상태

            // --- [New] Clip Library State ---
            const [clipsList, setClipsList] = useState([]);
            const [clipTitle, setClipTitle] = useState("");
            // [New] UI 개선을 위한 추가 State 및 Ref
            const [totalDuration, setTotalDuration] = useState(0); // 전체 영상 길이
            const [activeIndex, setActiveIndex] = useState(-1);    // 현재 하이라이트된 대사 인덱스
            const itemRefs = useRef([]);                           // 스크롤 이동을 위한 DOM 참조

            // [추가] 여기부터 블로그 뷰 데이터 가공 로직입니다.
            // 챕터별로 대사를 그룹화하는 로직 (Memoization으로 성능 최적화)
            const blogContent = useMemo(() => {
                if (!playerData || !playerData.chapters || !playerData.transcripts) return [];

                return playerData.chapters.map((chapter, idx) => {
                    // 마지막 챕터인 경우 종료 시간 처리
                    const nextChapterStart = playerData.chapters[idx + 1]?.time.start || Infinity;
                    const endTime = Math.min(chapter.time.end, nextChapterStart);

                    // 해당 챕터 시간에 포함되는 대사들 필터링
                    const scripts = playerData.transcripts.filter(t =>
                        t.start >= chapter.time.start && t.start < endTime
                    );

                    // 대사들을 하나의 문자열로 결합
                    const fullText = scripts.map(s => s.text).join(" ");

                    return {
                        ...chapter,
                        fullText: fullText || "(대사 없음. 음악이나 무음 구간일 수 있습니다.)"
                    };
                });
            }, [playerData]);

            // --- [New] Clip Library API ---
            const fetchClips = async (filename) => {
                try {
                    const res = await axios.get(`/api/clips/${filename}?t=${Date.now()}`);
                    setClipsList(res.data);
                } catch (err) {
                    console.error("Failed to fetch clips:", err);
                }
            };

            const handleDeleteClip = async (clipId) => {
                if (!confirm("정말로 이 클립을 삭제하시겠습니까?")) return;
                try {
                    await axios.delete(`/api/clips/${playerData.video_filename}/${clipId}`);
                    // 목록 갱신
                    fetchClips(playerData.video_filename);
                } catch (err) {
                    alert("삭제 실패: " + err.message);
                }
            };
            
            // [New] 프리미어 프로 XML 내보내기 핸들러
            const handleExportPremiere = async (e, clipId) => {
                e.preventDefault();
                e.stopPropagation(); // 아코디언 토글 방지

                if (!confirm("프리미어 프로용 XML 시퀀스 파일을 다운로드하시겠습니까?\n\n[사용법]\n1. 다운로드된 XML 파일을 프리미어 프로에서 [File] -> [Import] 하세요.\n2. 원본 영상과 자동으로 연결됩니다.")) return;

                try {
                    // Blob 형태로 응답을 받아야 파일 다운로드가 가능합니다.
                    const response = await axios.post('/api/export/premiere', {
                        video_filename: playerData.video_filename,
                        clip_id: clipId
                    }, {
                        responseType: 'blob' 
                    });

                    // 브라우저 가상 URL 생성 및 클릭 트리거
                    const url = window.URL.createObjectURL(new Blob([response.data]));
                    const link = document.createElement('a');
                    link.href = url;
                    
                    // 파일명 추출 (헤더에 없으면 기본값 사용)
                    let fileName = `Premiere_Seq_${clipId.substring(0,8)}.xml`;
                    const contentDisposition = response.headers['content-disposition'];
                    if (contentDisposition) {
                        const fileNameMatch = contentDisposition.match(/filename="?([^"]+)"?/);
                        if (fileNameMatch && fileNameMatch.length === 2) fileName = fileNameMatch[1];
                    }
                    
                    link.setAttribute('download', fileName);
                    document.body.appendChild(link);
                    link.click();
                    
                    // 뒷정리
                    link.remove();
                    window.URL.revokeObjectURL(url);

                } catch (err) {
                    console.error(err);
                    alert("XML 내보내기 실패: 서버 오류가 발생했습니다.");
                }
            };



            const videoRef = useRef(null);

            // --- [Lifecycle & Polling] ---
            useEffect(() => {
                fetchHistory();
                const interval = setInterval(fetchActiveTasks, 2000);
                return () => clearInterval(interval);
            }, []);

            // 작업 완료 감지
            const prevTaskCount = useRef(0);
            useEffect(() => {
                // 작업 개수가 줄어들었다 = 작업이 완료되었다
                if (prevTaskCount.current > 0 && activeTasks.length < prevTaskCount.current) {
                    fetchHistory(); // 메인 목록 갱신

                    // [New] 현재 플레이어 화면이면 추가 데이터 갱신
                    if (viewMode === 'player' && playerData) {
                        fetchClips(playerData.video_filename);
                        
                        // [Add] 블로그 재생성이나 분석 작업이 완료된 경우 playerData 자체를 최신화
                        // historyList가 fetchHistory()로 인해 업데이트될 것이므로, 거기서 현재 파일에 해당하는 데이터를 찾아 매칭
                        setTimeout(async () => {
                            try {
                                const res = await axios.get(`/api/history?t=${Date.now()}`);
                                const updatedItem = res.data.find(h => h.filename === playerData.video_filename);
                                if (updatedItem) {
                                    // 기존 transcript 데이터는 유지하면서 chapters 등 결과 데이터만 교체
                                    setPlayerData(prev => ({
                                        ...prev,
                                        ...updatedItem.result_data
                                    }));
                                }
                            } catch (e) { console.error("Auto-refresh failed", e); }
                        }, 500); // DB/파일 저장 시간을 고려한 미세한 지연
                    }
                }
                prevTaskCount.current = activeTasks.length;
            }, [activeTasks, viewMode, playerData]);

            // [Modified] 영상 시간 업데이트 핸들러 (자막 동기화 + 자동 스크롤 + 하이라이트)
            const handleTimeUpdate = () => {
                if (!videoRef.current || !playerData.transcripts) return;

                const currentTime = videoRef.current.currentTime;

                // 1. 오버레이 자막 처리 (기존 로직)
                const activeItem = playerData.transcripts.find(
                    item => currentTime >= item.start && currentTime <= item.end
                );
                setCurrentSubtitle(activeItem ? activeItem.text : "");

                // 2. [New] 스크립트 하이라이트 및 자동 스크롤
                // 현재 시간에 해당하는 인덱스 찾기
                const index = playerData.transcripts.findIndex(
                    item => currentTime >= item.start && currentTime <= item.end
                );

                if (index !== -1 && index !== activeIndex) {
                    setActiveIndex(index);

                    // 스크립트 탭이 활성화되어 있을 때만 자동 스크롤
                    if (activeTab === 'transcript' && itemRefs.current[index]) {
                        itemRefs.current[index].scrollIntoView({
                            behavior: 'smooth',
                            block: 'center'
                        });
                    }
                }
            };

            // [New] 비디오 영역 마우스 움직임 핸들러 (컨트롤 바 감지 시뮬레이션)
            const handleVideoMouseMove = () => {
                setIsControlsVisible(true);

                // 기존 타이머 취소 후 재설정
                if (controlsTimeoutRef.current) {
                    clearTimeout(controlsTimeoutRef.current);
                }

                // 2.5초 동안 움직임 없으면 컨트롤 바 사라짐으로 간주
                controlsTimeoutRef.current = setTimeout(() => {
                    setIsControlsVisible(false);
                }, 2500);
            };

            // [New] 비디오 영역 마우스 이탈 핸들러
            const handleVideoMouseLeave = () => {
                if (controlsTimeoutRef.current) {
                    clearTimeout(controlsTimeoutRef.current);
                }
                setIsControlsVisible(false);
            };

            // --- [API Handlers] ---
            const fetchHistory = async () => {
                try {
                    const res = await axios.get(`/api/history?t=${Date.now()}`);
                    setHistoryList(res.data);
                } catch (err) { console.error(err); }
            };

            const fetchActiveTasks = async () => {
                try {
                    const res = await axios.get(`/api/tasks?t=${Date.now()}`);
                    setActiveTasks(res.data);
                } catch (err) { console.error(err); }
            };

            const handleAnalyze = async () => {
                if (!urlInput) return alert("URL을 입력해주세요.");

                setLoading(true);
                try {
                    // [New] custom_title 함께 전송
                    await axios.post('/api/process', {
                        url: urlInput,
                        custom_title: titleInput
                    });

                    setUrlInput("");
                    setTitleInput(""); // 초기화
                    alert("분석 작업이 백그라운드에서 시작되었습니다.");
                    fetchActiveTasks();
                } catch (err) {
                    alert("요청 실패: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleFileUpload = async (file) => {
                if (!file) return;
                setLoading(true);
                try {
                    // 1. Upload
                    const formData = new FormData();
                    formData.append("file", file);
                    const upRes = await axios.post('/api/upload', formData);

                    // 2. Process Request (제목 입력값이 있으면 같이 전송)
                    await axios.post('/api/process', {
                        filename: upRes.data.filename,
                        custom_title: titleInput
                    });

                    setTitleInput(""); // 초기화
                    alert("파일 업로드 완료. 분석이 시작됩니다.");
                    fetchActiveTasks();
                } catch (err) {
                    alert("오류 발생: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleDelete = async (e, filename) => {
                e.stopPropagation();
                if (!confirm("정말로 이 기록을 삭제하시겠습니까? (영상 파일도 함께 삭제됩니다)")) return;

                try {
                    await axios.delete(`/api/history/${filename}`);
                    fetchHistory();
                } catch (err) {
                    alert("삭제 실패: " + err.message);
                }
            };

            // [New] 작업 취소 핸들러
            const handleCancelTask = async (taskId) => {
                if (!confirm("현재 작업을 취소하시겠습니까?\n(진행 중인 내용은 저장되지 않습니다)")) return;

                try {
                    // 3단계에서 만든 취소 API 호출
                    await axios.delete(`/api/tasks/${taskId}`);

                    // 즉시 UI 갱신 (사용자에게 반응성 제공)
                    fetchActiveTasks();
                } catch (err) {
                    alert("취소 요청 실패: " + err.message);
                }
            };

            const loadPlayer = async (item) => {
                try {
                    let transcripts = [];
                    if (item.result_data.has_transcript_file) {
                        const tRes = await axios.get(`/static/results/${item.result_data.transcript_json_filename}?t=${Date.now()}`);
                        transcripts = tRes.data;
                    }

                    setPlayerData({
                        ...item.result_data,
                        transcripts: transcripts
                    });

                    // [New] 클립 목록 불러오기
                    fetchClips(item.filename);

                    // 기존 초기화 로직
                    setEditTitleText(item.result_data.video_title || item.result_data.video_filename);
                    setIsEditingTitle(false);
                    setShowSubtitle(true);
                    setClipTitle(""); // 클립 제목 입력 초기화

                    setViewMode('player');
                    setActiveTab('chapters');
                } catch (err) {
                    console.error(err);
                    alert("데이터 로드 실패");
                }
            };

            // [New] 제목 수정 핸들러
            const handleUpdateTitle = async () => {
                if (!editTitleText.trim()) return alert("제목을 입력해주세요.");

                try {
                    await axios.patch(`/api/history/${playerData.video_filename}`, {
                        title: editTitleText
                    });

                    // 로컬 상태 업데이트
                    setPlayerData(prev => ({ ...prev, video_title: editTitleText }));
                    setIsEditingTitle(false);
                    fetchHistory(); // 목록도 갱신
                } catch (err) {
                    alert("제목 수정 실패: " + err.message);
                }
            };

            // [추가] 안전한 클립보드 복사 핸들러
            const handleCopyFullText = async () => {
                if (!blogContent || blogContent.length === 0) return;

                const textToCopy = blogContent.map(b => `[${b.title}]\n${b.fullText}`).join('\n\n');

                try {
                    await navigator.clipboard.writeText(textToCopy);
                    alert('클립보드에 전체 내용이 복사되었습니다!');
                } catch (err) {
                    console.error('Copy failed:', err);
                    // 보안상 자동 복사가 막힌 경우를 대비한 안내
                    alert('복사에 실패했습니다.\n(보안 문제로 HTTPS 또는 localhost 환경이 필요할 수 있습니다.)');
                }
            };

            // Player Utils
            const seekVideo = (time) => {
                if (videoRef.current) {
                    videoRef.current.currentTime = time;
                    videoRef.current.play();
                }
            };

            // [New] 전역 창에 seek 함수 노출 (마크다운 내부의 onclick에서 접근 가능하게 함)
            useEffect(() => {
                window.seekFromTimestamp = (seconds) => {
                    seekVideo(seconds);
                };
            }, [playerData]);

            const formatTime = (s) => {
                if (!s && s !== 0) return "0:00";
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return `${m}:${sec < 10 ? '0' : ''}${sec}`;
            };

            // --- [New] Clip Editor Handlers ---
            const setStartToCurrent = () => {
                if (videoRef.current) {
                    const t = videoRef.current.currentTime;
                    setClipStart(t);
                    // 만약 시작 시간이 종료 시간보다 뒤라면, 종료 시간을 자동으로 10초 뒤로 설정
                    if (t >= clipEnd) setClipEnd(t + 10);
                }
            };

            const setEndToCurrent = () => {
                if (videoRef.current) {
                    const t = videoRef.current.currentTime;
                    if (t <= clipStart) {
                        alert("종료 시간은 시작 시간보다 뒤여야 합니다.");
                        return;
                    }
                    setClipEnd(t);
                }
            };

            // [Async] 클립 내보내기 핸들러 (수정됨)
            const handleExportClip = async () => {
                if (clipEnd <= clipStart) return alert("구간 설정이 올바르지 않습니다.");

                // [New] 제목 입력 확인
                const finalTitle = clipTitle.trim() || `Clip_${formatTime(clipStart)}-${formatTime(clipEnd)}`;

                setIsClipMode(false); // UI 닫기

                try {
                    await axios.post('/api/export/clip', {
                        filename: playerData.video_filename,
                        start_time: clipStart,
                        end_time: clipEnd,
                        title: finalTitle // [New] 제목 전송
                    });

                    alert("클립 생성 작업이 시작되었습니다. 완료되면 아래 보관함에 나타납니다.");
                    setClipTitle(""); // 입력창 초기화
                    fetchActiveTasks();

                } catch (err) {
                    console.error(err);
                    alert("요청 실패: " + err.message);
                }
            };
            // ----------------------------------

            // [New] AI 숏츠 생성 핸들러
            const handleAutoGenerateShorts = async () => {
                if (!confirm("AI가 이 영상의 하이라이트를 찾아 숏츠로 제작합니다.\n(약 1~2분 소요)\n\n계속하시겠습니까?")) return;

                try {
                    await axios.post('/api/shorts/auto-generate', {
                        filename: playerData.video_filename
                    });

                    alert("AI 숏츠 제작이 시작되었습니다!\n우측 하단 작업 모니터에서 진행 상황을 확인하세요.");
                    fetchActiveTasks(); // 작업 목록 갱신

                } catch (err) {
                    console.error(err);
                    alert("요청 실패: " + err.message);
                }
            };

            // [New] 블로그 뷰 재생성 핸들러
            const handleRegenerateBlog = async () => {
                if (!confirm("기존 블로그 내용을 지우고 AI가 다시 작성합니다.\n(약 1분 소요)\n\n계속하시겠습니까?")) return;

                try {
                    await axios.post('/api/blog/regenerate', {
                        filename: playerData.video_filename
                    });

                    alert("블로그 재생성이 시작되었습니다!\n우측 하단 작업 모니터에서 진행 상황을 확인하세요.");
                    fetchActiveTasks(); // 작업 목록 갱신

                } catch (err) {
                    console.error(err);
                    alert("요청 실패: " + err.message);
                }
            };

            // [New] AI 숏츠와 일반 클립 분리 (Memoization)
            const { aiShorts, manualClips } = useMemo(() => {
                const ai = [];
                const manual = [];
                clipsList.forEach(clip => {
                    if (clip.is_ai_generated) ai.push(clip);
                    else manual.push(clip);
                });
                return { aiShorts: ai, manualClips: manual };
            }, [clipsList]);

            // [Helper] 숏츠 재생 시간(상대 시간)을 원본 영상 시간(절대 시간)으로 변환
            const getOriginalTimeFromShorts = (shortsTime, segments) => {
                if (!segments || segments.length === 0) return 0;

                let remaining = shortsTime;
                for (let seg of segments) {
                    const duration = seg.end - seg.start;
                    if (remaining <= duration) {
                        return seg.start + remaining;
                    }
                    remaining -= duration;
                }
                // 마지막 구간을 넘어가면 마지막 세그먼트의 끝으로 간주
                return segments[segments.length - 1].end;
            };

            // [State] 현재 재생 중인 숏츠의 정보 (하이라이팅용)
            const [activeShortsId, setActiveShortsId] = useState(null);
            const [currentShortsOriginalTime, setCurrentShortsOriginalTime] = useState(0);

            // [Helper] 원본 영상 시간(Original Time)을 숏츠 타임라인(Shorts Time)으로 변환
            const getShortsTimeFromOriginal = (originalTime, segments) => {
                if (!segments) return 0;

                let accumulatedDuration = 0;
                for (let seg of segments) {
                    // 목표 시간이 현재 세그먼트 내에 있는 경우
                    if (originalTime >= seg.start && originalTime <= seg.end) {
                        return accumulatedDuration + (originalTime - seg.start);
                    }
                    // 목표 시간이 현재 세그먼트보다 뒤에 있는 경우 (누적 시간 더하기)
                    accumulatedDuration += (seg.end - seg.start);
                }
                return 0; // 매칭되지 않으면 0초
            };

            // [Handler] 숏츠 스크립트 클릭 시 해당 위치로 이동
            const handleJumpToShortsScript = (e, videoId, originalTime, segments) => {
                e.stopPropagation(); // 드롭다운 토글 방지
                e.preventDefault();

                const videoEl = document.getElementById(videoId);
                if (videoEl) {
                    const targetShortsTime = getShortsTimeFromOriginal(originalTime, segments);
                    videoEl.currentTime = targetShortsTime;
                    videoEl.play();
                }
            };

            // [State] 현재 재생 중인 숏츠의 자막 텍스트
            const [currentShortsSubtitle, setCurrentShortsSubtitle] = useState("");

            // [Handler] 숏츠 타임 업데이트 핸들러 (수정됨: 하이라이팅 지원)
            const handleShortsTimeUpdate = (e, segments, clipId) => {
                if (!playerData.transcripts) return;

                const currentTime = e.target.currentTime;
                const originalTime = getOriginalTimeFromShorts(currentTime, segments);

                // 1. 오버레이 자막 업데이트
                const activeItem = playerData.transcripts.find(
                    item => originalTime >= item.start && originalTime <= item.end
                );
                setCurrentShortsSubtitle(activeItem ? activeItem.text : "");

                // 2. 하이라이팅을 위한 상태 업데이트 (불필요한 리렌더링 방지)
                // 현재 재생 중인 클립 ID와 원본 시간 저장
                if (activeShortsId !== clipId) setActiveShortsId(clipId);

                // 0.5초 단위로만 상태 업데이트 (성능 최적화)
                if (Math.abs(currentShortsOriginalTime - originalTime) > 0.5) {
                    setCurrentShortsOriginalTime(originalTime);
                }
            };

            // [New] 숏츠 스크립트 자동 스크롤을 위한 Effect
            useEffect(() => {
                // 숏츠 탭이 아니거나, 활성화된 숏츠가 없거나, 데이터가 없으면 실행하지 않음
                if (activeTab !== 'shorts' || !activeShortsId || !playerData?.transcripts) return;

                // 1. 현재 재생 중인 원본 시간(currentShortsOriginalTime)에 해당하는 스크립트 인덱스 찾기
                const activeIndex = playerData.transcripts.findIndex(
                    t => currentShortsOriginalTime >= t.start && currentShortsOriginalTime <= t.end
                );

                if (activeIndex !== -1) {
                    // 2. 해당 요소의 ID 생성 (렌더링 시 부여할 ID 규칙과 일치해야 함)
                    // 형식: shorts-script-item-{ShortsID}-{TranscriptIndex}
                    const elementId = `shorts-script-item-${activeShortsId}-${activeIndex}`;
                    const element = document.getElementById(elementId);

                    if (element) {
                        // 3. 부드럽게 스크롤 이동 (block: 'center'로 중앙 정렬)
                        element.scrollIntoView({
                            behavior: 'smooth',
                            block: 'center'
                        });
                    }
                }
            }, [currentShortsOriginalTime, activeShortsId, activeTab, playerData]);

            // --- [Render] ---
            return (
                <div className="flex flex-col h-screen overflow-hidden">
                    {/* [Modified] Header: 고정 높이 적용 (shrink-0) */}
                    <header className="shrink-0 bg-white border-b py-4 px-6 shadow-sm z-30">
                        <div className="max-w-7xl mx-auto flex justify-between items-center w-full">
                            <h1 onClick={() => setViewMode('dashboard')}
                                className="text-2xl font-bold text-indigo-600 flex items-center gap-2 cursor-pointer hover:opacity-80 transition">
                                🤖 AI Video Analyst
                            </h1>
                            {viewMode === 'player' && (
                                <button onClick={() => setViewMode('dashboard')} className="text-sm font-bold text-gray-500 hover:text-indigo-600 flex items-center gap-1">
                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                                    대시보드로 나가기
                                </button>
                            )}
                        </div>
                    </header>

                    {/* Task Monitor Widget */}
                    {/* [Modify] activeTasks와 함께 onCancel 핸들러를 전달합니다 */}
                    <TaskMonitor
                        tasks={activeTasks}
                        onCancel={handleCancelTask}
                    />

                    <main className="flex-1 flex overflow-hidden bg-gray-50">

                        {/* --- View 1: Dashboard --- */}
                        {viewMode === 'dashboard' && (
                            // [수정] 전체 높이(h-full)와 스크롤(overflow-y-auto)을 적용하여 목록이 많아져도 스크롤 가능하게 함
                            <div className="w-full h-full overflow-y-auto custom-scrollbar">
                                <div className="max-w-6xl mx-auto p-4 md:p-8 fade-in space-y-12">
                                    {/* Input Section */}
                                    <section className="bg-white p-8 rounded-2xl shadow-sm border border-gray-200">
                                        <h2 className="text-xl font-bold text-gray-800 mb-6 text-center">새 영상 분석하기</h2>
                                        <div className="max-w-2xl mx-auto space-y-6">

                                            {/* URL Input */}
                                            <div className="flex gap-3">
                                                <input
                                                    type="text"
                                                    placeholder="YouTube URL을 입력하세요..."
                                                    className="flex-1 p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition"
                                                    value={urlInput}
                                                    onChange={(e) => setUrlInput(e.target.value)}
                                                    disabled={loading}
                                                />
                                            </div>

                                            {/* [New] Title Input */}
                                            <div>
                                                <input
                                                    type="text"
                                                    placeholder="영상 제목을 미리 설정할 수 있습니다 (선택사항)"
                                                    className="w-full p-3 border border-gray-300 rounded-xl focus:ring-2 focus:ring-indigo-500 outline-none transition text-sm"
                                                    value={titleInput}
                                                    onChange={(e) => setTitleInput(e.target.value)}
                                                    disabled={loading}
                                                />
                                                <p className="text-xs text-gray-400 mt-1 ml-1">
                                                    * 비워두면 유튜브 제목이나 파일명을 그대로 사용합니다.
                                                </p>
                                            </div>

                                            {/* Action Buttons */}
                                            <div className="flex gap-4">
                                                <button
                                                    onClick={handleAnalyze}
                                                    disabled={loading}
                                                    className="flex-1 bg-indigo-600 text-white px-6 py-3 rounded-xl font-bold hover:bg-indigo-700 disabled:bg-gray-400 transition shadow-md">
                                                    {loading ? "분석 요청 중..." : "🚀 URL 분석 시작"}
                                                </button>
                                            </div>

                                            <div className="relative flex py-2 items-center">
                                                <div className="flex-grow border-t border-gray-200"></div>
                                                <span className="flex-shrink-0 mx-4 text-gray-400 text-xs">OR</span>
                                                <div className="flex-grow border-t border-gray-200"></div>
                                            </div>

                                            <label className="block w-full cursor-pointer bg-gray-50 border-2 border-dashed border-gray-300 rounded-xl p-4 text-center hover:bg-indigo-50 transition group">
                                                <span className="text-gray-500 group-hover:text-indigo-600 font-medium">
                                                    📁 로컬 MP4 파일 업로드 (제목 입력 후 선택)
                                                </span>
                                                <input type="file" accept="video/mp4" className="hidden"
                                                    onChange={(e) => handleFileUpload(e.target.files[0])}
                                                />
                                            </label>
                                        </div>
                                    </section>

                                    {/* History Section */}
                                    <section>
                                        <h3 className="text-lg font-bold text-gray-700 mb-4 flex items-center gap-2">
                                            📚 분석 완료 목록
                                            <span className="bg-gray-200 text-gray-600 text-xs px-2 py-0.5 rounded-full">{historyList.length}</span>
                                        </h3>

                                        {historyList.length === 0 ? (
                                            <div className="text-center py-12 text-gray-400 bg-white rounded-xl border border-dashed">
                                                아직 분석된 영상이 없습니다.
                                            </div>
                                        ) : (
                                            <div className="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6 pb-10">
                                                {historyList.map((item, idx) => (
                                                    <div key={idx}
