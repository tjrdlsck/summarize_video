<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Video Analyst - Insight Player</title>

    <!-- React & ReactDOM (CDN) -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>

    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- Axios (HTTP Client) -->
    <script src="https://unpkg.com/axios/dist/axios.min.js"></script>

    <!-- Custom Style -->
    <style>
        /* 기본 스크롤바 스타일링 */
        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #f1f1f1;
        }

        ::-webkit-scrollbar-thumb {
            background: #c7c7c7;
            border-radius: 4px;
        }

        ::-webkit-scrollbar-thumb:hover {
            background: #a0a0a0;
        }

        .highlight-hover:hover {
            background-color: #f0f9ff;
            cursor: pointer;
            transition: 0.2s;
        }

        /* Sticky Video Wrapper */
        .video-sticky-wrapper {
            position: sticky;
            top: 0;
            z-index: 50;
            background-color: black;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        .fade-in {
            animation: fadeIn 0.5s ease-in-out;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* [추가] 블로그 모드용 타이포그래피 */
        .prose-custom {
            line-height: 1.8;
            /* 줄 간격을 넓혀서 읽기 편하게 */
            letter-spacing: -0.01em;
            word-break: keep-all;
            /* 한글 단어 끊김 방지 */
            text-align: justify;
            /* 양쪽 정렬 */
        }

        /* Markdown Custom Styles */
        .markdown-body h3 {
            font-size: 1.25rem;
            font-weight: 700;
            color: #1f2937;
            /* Gray-800 */
            margin-top: 1.5rem;
            margin-bottom: 0.75rem;
        }

        .markdown-body p {
            margin-bottom: 1rem;
            line-height: 1.75;
            color: #374151;
            /* Gray-700 */
        }

        .markdown-body ul {
            list-style-type: disc;
            padding-left: 1.5rem;
            margin-bottom: 1rem;
        }

        .markdown-body li {
            margin-bottom: 0.5rem;
        }

        .markdown-body blockquote {
            border-left: 4px solid #6366f1;
            /* Indigo-500 */
            background-color: #f9fafb;
            padding: 1rem;
            margin: 1.5rem 0;
            font-style: italic;
            color: #4b5563;
        }

        .markdown-body strong {
            color: #4f46e5;
            /* Indigo-600 */
            font-weight: 700;
        }

        /* [New] Mobile Safe Area & Animations */
        .pb-safe {
            padding-bottom: env(safe-area-inset-bottom, 20px);
        }

        .mobile-drawer-enter {
            transform: translateY(100%);
        }

        .mobile-drawer-enter-active {
            transform: translateY(0);
            transition: transform 0.3s ease-out;
        }

        .mobile-drawer-exit {
            transform: translateY(0);
        }

        .mobile-drawer-exit-active {
            transform: translateY(100%);
            transition: transform 0.2s ease-in;
        }

        /* Mobile Tab Bar Active Indicator */
        .mobile-tab-active {
            color: #4f46e5;
            /* Indigo-600 */
        }

        .mobile-tab-active svg {
            fill: #e0e7ff;
            /* Indigo-100 */
            stroke: #4f46e5;
        }
    </style>
</head>

<body class="bg-gray-50 text-gray-800 font-sans min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        // [New] 시간 포맷 유틸리티 (초 -> HH:MM:SS.mmm)
        const formatTimeDetail = (seconds) => {
            if (isNaN(seconds) || seconds < 0) return "00:00:00.000";
            const h = Math.floor(seconds / 3600);
            const m = Math.floor((seconds % 3600) / 60);
            const s = Math.floor(seconds % 60);
            const ms = Math.floor((seconds - Math.floor(seconds)) * 1000);

            const hStr = String(h).padStart(2, '0');
            const mStr = String(m).padStart(2, '0');
            const sStr = String(s).padStart(2, '0');
            const msStr = String(ms).padStart(3, '0');

            return `${hStr}:${mStr}:${sStr}.${msStr}`;
        };

        // [Add] 문장 부호 제거 유틸리티 (., ?, !, ,)
        const removePunctuation = (text) => {
            if (!text) return "";
            return text.replace(/[.,?!]/g, "");
        };

        // [Add] 레거시 데이터(과거 분석 기록) 제목 정규화 유틸리티
        // 백엔드 패치 이전에 생성된 데이터의 제목(.mp4, _ 포함)을 UI에서 즉시 교정하여 보여줍니다.
        const normalizeLegacyTitle = (title) => {
            if (!title) return "제목 없음";

            // 이미 깔끔한 경우(확장자 없고, 언더스코어 없고, UUID 패턴도 없는 경우)는 패스
            // (UUID 패턴 검사는 복잡하므로, 아래 로직을 항상 타게 해도 무방합니다)

            let clean = title;

            // 1. [New] UUID 접두사 제거 (8자리 hex + _)
            // 정규식: 시작(^)에서 16진수 8자리와 _를 찾아서 빈 문자열로 치환
            clean = clean.replace(/^[0-9a-fA-F]{8}_/, "");

            // 2. 확장자 제거
            clean = clean.replace(/\.[^/.]+$/, "");

            // 3. 언더스코어를 공백으로 치환
            clean = clean.replace(/_/g, " ");

            // 4. 양쪽 공백 제거
            return clean.trim();
        };

        const { useState, useRef, useEffect, useMemo } = React;

        // --- [Sub Component] Task Monitor Widget (Hybrid: Desktop Widget / Mobile FAB) ---
        function TaskMonitor({ tasks, onCancel }) {
            const [isOpen, setIsOpen] = useState(false); // Mobile Drawer State

            if (!tasks || tasks.length === 0) return null;

            // --- [Mobile View] Floating Action Button & Drawer ---
            const MobileView = () => (
                <div className="lg:hidden fixed bottom-20 right-4 z-40">
                    {/* FAB (Floating Action Button) */}
                    <button
                        onClick={() => setIsOpen(true)}
                        className="bg-indigo-600 text-white p-3 rounded-full shadow-lg flex items-center justify-center relative animate-bounce-slight"
                    >
                        {/* Loading Spinner Icon */}
                        <svg className="w-6 h-6 animate-spin" fill="none" viewBox="0 0 24 24">
                            <circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle>
                            <path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                        </svg>
                        <span className="absolute -top-1 -right-1 bg-red-500 text-white text-[10px] font-bold px-1.5 py-0.5 rounded-full border border-white">
                            {tasks.length}
                        </span>
                    </button>

                    {/* Mobile Drawer (Overlay) */}
                    {isOpen && (
                        <div className="fixed inset-0 z-50 flex flex-col justify-end bg-black/50 fade-in">
                            <div className="bg-white rounded-t-2xl p-4 w-full max-h-[80vh] overflow-y-auto pb-safe shadow-2xl relative animate-slide-up">
                                <div className="flex justify-between items-center mb-4 border-b border-gray-100 pb-2">
                                    <h3 className="font-bold text-gray-800 text-lg">작업 대기열 ({tasks.length})</h3>
                                    <button onClick={(e) => { e.stopPropagation(); setIsOpen(false); }} className="p-2 text-gray-400 hover:text-gray-600">
                                        <svg className="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg>
                                    </button>
                                </div>
                                {/* Task List Rendering (Reused) */}
                                <div className="space-y-4">
                                    {tasks.map((task, index) => renderTaskItem(task, index))}
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );

            // --- [Desktop View] Fixed Widget ---
            const DesktopView = () => (
                <div className="hidden lg:flex fixed bottom-6 right-6 w-96 bg-white rounded-xl shadow-2xl border border-indigo-100 overflow-hidden z-50 fade-in flex-col max-h-[80vh]">
                    <div className="bg-indigo-600 px-4 py-3 flex justify-between items-center shrink-0">
                        <h3 className="text-white font-bold text-sm flex items-center gap-2">
                            <span className="animate-spin h-3 w-3 border-2 border-white border-t-transparent rounded-full"></span>
                            작업 대기열 ({tasks.length})
                        </h3>
                        <span className="text-xs text-indigo-200">자동 갱신 중</span>
                    </div>
                    <div className="overflow-y-auto p-4 space-y-4 custom-scrollbar">
                        {tasks.map((task, index) => renderTaskItem(task, index))}
                    </div>
                </div>
            );

            // Helper: Render individual task item (Used by both Mobile & Desktop)
            const renderTaskItem = (task, index) => {
                let statusColor = "bg-indigo-500";
                let statusText = `${task.progress}%`;
                let isCancelable = true;

                if (task.status === 'queued') {
                    statusColor = "bg-gray-300";
                    statusText = "대기 중";
                } else if (task.status === 'canceling') {
                    statusColor = "bg-red-400";
                    statusText = "중단 중...";
                    isCancelable = false;
                } else if (task.status === 'failed') {
                    statusColor = "bg-red-500";
                    statusText = "오류/취소";
                    isCancelable = false;
                } else if (task.status === 'completed') {
                    statusColor = "bg-green-500";
                    statusText = "완료";
                    isCancelable = false;
                }

                return (
                    <div key={task.task_id} className="text-sm border-b border-gray-100 last:border-0 pb-3 last:pb-0 relative group">
                        <div className="flex justify-between text-gray-700 mb-1 items-center">
                            <div className="flex flex-col w-2/3">
                                <span className="font-bold truncate" title={task.filename}>
                                    {index + 1}. {normalizeLegacyTitle(task.filename)}
                                </span>
                                <span className="text-xs text-gray-400">
                                    {task.type === 'clip_export' ? '✂️ 클립 생성' : '🤖 영상 분석'}
                                </span>
                            </div>
                            {isCancelable && (
                                <button
                                    onClick={() => onCancel(task.task_id)}
                                    className="text-xs bg-white border border-red-200 text-red-500 px-2 py-0.5 rounded hover:bg-red-50 transition"
                                >
                                    중단
                                </button>
                            )}
                        </div>
                        <div className="w-full bg-gray-100 rounded-full h-2 mb-1.5 overflow-hidden">
                            {task.status === 'queued' ? (
                                <div className="h-full w-full bg-[url('data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAAAQAAAAECAYAAACp8Z5+AAAAIklEQVQIW2NkQAKrVq36zwjjgzjwqgAA6gJwww==')] opacity-30"></div>
                            ) : (
                                <div className={`h-2 rounded-full transition-all duration-500 ${statusColor}`} style={{ width: `${task.progress}%` }}></div>
                            )}
                        </div>
                        <div className="flex justify-between items-center text-xs">
                            <p className="text-gray-500 truncate w-3/4">
                                {task.status === 'queued' ? `대기 순번: ${index + 1}번째` : task.message}
                            </p>
                            <span className={`font-bold ${task.status === 'failed' ? 'text-red-500' : 'text-indigo-600'}`}>
                                {statusText}
                            </span>
                        </div>
                        {task.status === 'completed' && task.type === 'clip_export' && task.result && (
                            <div className="mt-1 text-right">
                                <a href={task.result.download_url} className="inline-block text-xs bg-green-500 text-white px-2 py-1 rounded hover:bg-green-600 transition font-bold no-underline" download>⬇ 다운로드</a>
                            </div>
                        )}
                    </div>
                );
            };

            return (
                <>
                    <DesktopView />
                    <MobileView />
                </>
            );
        }

        // [New] 구간 시각화 컴포넌트 (타임라인 바)
        const TimelineVisualizer = ({ totalDuration, start, end }) => {
            if (!totalDuration) return null;

            // 퍼센트 계산 (0~100%)
            const startPct = Math.min(100, Math.max(0, (start / totalDuration) * 100));
            const endPct = Math.min(100, Math.max(0, (end / totalDuration) * 100));
            const widthPct = endPct - startPct;

            return (
                <div className="w-full mt-3 mb-1 px-1">
                    <div className="flex justify-between text-xs text-gray-400 mb-1 font-mono">
                        <span>0:00</span>
                        <span>{formatTimeDetail(totalDuration).split('.')[0]}</span>
                    </div>
                    {/* 트랙 배경 */}
                    <div className="relative w-full h-4 bg-gray-200 rounded-full overflow-hidden shadow-inner">
                        {/* 현재 구간 하이라이트 */}
                        <div
                            className="absolute top-0 h-full bg-indigo-500 opacity-80 transition-all duration-300 ease-out"
                            style={{ left: `${startPct}%`, width: `${widthPct}%` }}
                        ></div>
                    </div>
                    {/* 텍스트 정보 */}
                    <div className="text-center mt-1">
                        <span className="text-xs font-bold text-indigo-600 bg-indigo-50 px-2 py-0.5 rounded">
                            선택 구간: {((end - start) || 0).toFixed(1)}초
                        </span>
                    </div>
                </div>
            );
        };

        // --- [Main Application] ---
        function App() {
            // View Mode: 'dashboard' | 'player'
            const [viewMode, setViewMode] = useState('dashboard');

            // Data State
            const [urlInput, setUrlInput] = useState("");
            const [titleInput, setTitleInput] = useState(""); // [New] 대시보드용 제목 입력
            const [historyList, setHistoryList] = useState([]);
            const [activeTasks, setActiveTasks] = useState([]);
            const [playerData, setPlayerData] = useState(null);

            // Player UI State
            const [loading, setLoading] = useState(false);
            const [activeTab, setActiveTab] = useState('chapters');
            // --- [Start] Accordion Logic ---
            // 챕터별 열림/닫힘 상태를 관리하는 State
            const [expandedChapters, setExpandedChapters] = useState({});

            // 데이터가 로드되면 기본적으로 모든 챕터를 '펼침(true)' 상태로 초기화
            useEffect(() => {
                if (playerData && playerData.chapters) {
                    const initialStates = {};
                    playerData.chapters.forEach((_, index) => {
                        initialStates[index] = true;
                    });
                    setExpandedChapters(initialStates);
                }
            }, [playerData]);

            // 개별 챕터 토글 함수
            const toggleChapter = (index) => {
                setExpandedChapters(prev => ({
                    ...prev,
                    [index]: !prev[index]
                }));
            };

            // 전체 펼치기/접기 제어 함수
            const setAllChapters = (isExpanded) => {
                if (!playerData || !playerData.chapters) return;
                const newStates = {};
                playerData.chapters.forEach((_, index) => {
                    newStates[index] = isExpanded;
                });
                setExpandedChapters(newStates);
            };
            // --- [End] Accordion Logic ---
            const [isEditingTitle, setIsEditingTitle] = useState(false); // [New] 제목 수정 모드
            const [editTitleText, setEditTitleText] = useState("");      // [New] 수정 중인 제목 텍스트
            const [showSubtitle, setShowSubtitle] = useState(true);      // [New] 자막 토글 상태
            const [currentSubtitle, setCurrentSubtitle] = useState(""); // [New] 커스텀 자막 텍스트 상태
            // [New] 컨트롤 바 표시 여부 감지용 상태 및 타이머 Ref
            const [isControlsVisible, setIsControlsVisible] = useState(false);
            const controlsTimeoutRef = useRef(null);
            // --- [New] Clip Editor State ---
            const [isClipMode, setIsClipMode] = useState(false); // 편집 모드 토글
            const [clipStart, setClipStart] = useState(0);       // 구간 시작 (초)
            const [clipEnd, setClipEnd] = useState(0);           // 구간 종료 (초)
            const [isExporting, setIsExporting] = useState(false); // 내보내기 로딩 상태

            // --- [New] Clip Library State ---
            const [clipsList, setClipsList] = useState([]);
            const [clipTitle, setClipTitle] = useState("");
            // [New] UI 개선을 위한 추가 State 및 Ref
            const [totalDuration, setTotalDuration] = useState(0); // 전체 영상 길이
            const [activeIndex, setActiveIndex] = useState(-1);    // 현재 하이라이트된 대사 인덱스
            const itemRefs = useRef([]);                           // 스크롤 이동을 위한 DOM 참조

            // [추가] 여기부터 블로그 뷰 데이터 가공 로직입니다.
            // 챕터별로 대사를 그룹화하는 로직 (Memoization으로 성능 최적화)
            const blogContent = useMemo(() => {
                if (!playerData || !playerData.chapters || !playerData.transcripts) return [];

                return playerData.chapters.map((chapter, idx) => {
                    // 마지막 챕터인 경우 종료 시간 처리
                    const nextChapterStart = playerData.chapters[idx + 1]?.time.start || Infinity;
                    const endTime = Math.min(chapter.time.end, nextChapterStart);

                    // 해당 챕터 시간에 포함되는 대사들 필터링
                    const scripts = playerData.transcripts.filter(t =>
                        t.start >= chapter.time.start && t.start < endTime
                    );

                    // 대사들을 하나의 문자열로 결합
                    const fullText = scripts.map(s => s.text).join(" ");

                    return {
                        ...chapter,
                        fullText: fullText || "(대사 없음. 음악이나 무음 구간일 수 있습니다.)"
                    };
                });
            }, [playerData]);

            // --- [New] Clip Library API ---
            const fetchClips = async (filename) => {
                try {
                    const res = await axios.get(`/api/clips/${filename}?t=${Date.now()}`);
                    setClipsList(res.data);
                } catch (err) {
                    console.error("Failed to fetch clips:", err);
                }
            };

            const handleDeleteClip = async (clipId) => {
                if (!confirm("정말로 이 클립을 삭제하시겠습니까?")) return;
                try {
                    await axios.delete(`/api/clips/${playerData.video_filename}/${clipId}`);
                    // 목록 갱신
                    fetchClips(playerData.video_filename);
                } catch (err) {
                    alert("삭제 실패: " + err.message);
                }
            };
            // -------------------------------



            const videoRef = useRef(null);

            // --- [Lifecycle & Polling] ---
            useEffect(() => {
                fetchHistory();
                const interval = setInterval(fetchActiveTasks, 2000);
                return () => clearInterval(interval);
            }, []);

            // 작업 완료 감지
            const prevTaskCount = useRef(0);
            useEffect(() => {
                // 작업 개수가 줄어들었다 = 작업이 완료되었다
                if (prevTaskCount.current > 0 && activeTasks.length < prevTaskCount.current) {
                    fetchHistory(); // 메인 목록 갱신

                    // [New] 현재 플레이어 화면이면 클립 목록도 갱신
                    if (viewMode === 'player' && playerData) {
                        fetchClips(playerData.video_filename);
                    }
                }
                prevTaskCount.current = activeTasks.length;
            }, [activeTasks, viewMode, playerData]); // 의존성 배열에 viewMode, playerData 추가

            // [Modified] 영상 시간 업데이트 핸들러 (자막 동기화 + 자동 스크롤 + 하이라이트)
            const handleTimeUpdate = () => {
                if (!videoRef.current || !playerData.transcripts) return;

                const currentTime = videoRef.current.currentTime;

                // 1. 오버레이 자막 처리 (기존 로직)
                const activeItem = playerData.transcripts.find(
                    item => currentTime >= item.start && currentTime <= item.end
                );
                setCurrentSubtitle(activeItem ? activeItem.text : "");

                // 2. [New] 스크립트 하이라이트 및 자동 스크롤
                // 현재 시간에 해당하는 인덱스 찾기
                const index = playerData.transcripts.findIndex(
                    item => currentTime >= item.start && currentTime <= item.end
                );

                if (index !== -1 && index !== activeIndex) {
                    setActiveIndex(index);

                    // 스크립트 탭이 활성화되어 있을 때만 자동 스크롤
                    if (activeTab === 'transcript' && itemRefs.current[index]) {
                        itemRefs.current[index].scrollIntoView({
                            behavior: 'smooth',
                            block: 'center'
                        });
                    }
                }
            };

            // [New] 비디오 영역 마우스 움직임 핸들러 (컨트롤 바 감지 시뮬레이션)
            const handleVideoMouseMove = () => {
                setIsControlsVisible(true);

                // 기존 타이머 취소 후 재설정
                if (controlsTimeoutRef.current) {
                    clearTimeout(controlsTimeoutRef.current);
                }

                // 2.5초 동안 움직임 없으면 컨트롤 바 사라짐으로 간주
                controlsTimeoutRef.current = setTimeout(() => {
                    setIsControlsVisible(false);
                }, 2500);
            };

            // [New] 비디오 영역 마우스 이탈 핸들러
            const handleVideoMouseLeave = () => {
                if (controlsTimeoutRef.current) {
                    clearTimeout(controlsTimeoutRef.current);
                }
                setIsControlsVisible(false);
            };

            // --- [API Handlers] ---
            const fetchHistory = async () => {
                try {
                    const res = await axios.get(`/api/history?t=${Date.now()}`);
                    setHistoryList(res.data);
                } catch (err) { console.error(err); }
            };

            const fetchActiveTasks = async () => {
                try {
                    const res = await axios.get(`/api/tasks?t=${Date.now()}`);
                    setActiveTasks(res.data);
                } catch (err) { console.error(err); }
            };

            const handleAnalyze = async () => {
                if (!urlInput) return alert("URL을 입력해주세요.");

                setLoading(true);
                try {
                    // [New] custom_title 함께 전송
                    await axios.post('/api/process', {
                        url: urlInput,
                        custom_title: titleInput
                    });

                    setUrlInput("");
                    setTitleInput(""); // 초기화
                    alert("분석 작업이 백그라운드에서 시작되었습니다.");
                    fetchActiveTasks();
                } catch (err) {
                    alert("요청 실패: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleFileUpload = async (file) => {
                if (!file) return;
                setLoading(true);
                try {
                    // 1. Upload
                    const formData = new FormData();
                    formData.append("file", file);
                    const upRes = await axios.post('/api/upload', formData);

                    // 2. Process Request (제목 입력값이 있으면 같이 전송)
                    await axios.post('/api/process', {
                        filename: upRes.data.filename,
                        custom_title: titleInput
                    });

                    setTitleInput(""); // 초기화
                    alert("파일 업로드 완료. 분석이 시작됩니다.");
                    fetchActiveTasks();
                } catch (err) {
                    alert("오류 발생: " + err.message);
                } finally {
                    setLoading(false);
                }
            };

            const handleDelete = async (e, filename) => {
                e.stopPropagation();
                if (!confirm("정말로 이 기록을 삭제하시겠습니까? (영상 파일도 함께 삭제됩니다)")) return;

                try {
                    await axios.delete(`/api/history/${filename}`);
                    fetchHistory();
                } catch (err) {
                    alert("삭제 실패: " + err.message);
                }
            };

            // [New] 작업 취소 핸들러
            const handleCancelTask = async (taskId) => {
                if (!confirm("현재 작업을 취소하시겠습니까?\n(진행 중인 내용은 저장되지 않습니다)")) return;

                try {
                    // 3단계에서 만든 취소 API 호출
                    await axios.delete(`/api/tasks/${taskId}`);

                    // 즉시 UI 갱신 (사용자에게 반응성 제공)
                    fetchActiveTasks();
                } catch (err) {
                    alert("취소 요청 실패: " + err.message);
                }
            };

            const loadPlayer = async (item) => {
                try {
                    let transcripts = [];
                    if (item.result_data.has_transcript_file) {
                        const tRes = await axios.get(`/static/results/${item.result_data.transcript_json_filename}?t=${Date.now()}`);
                        transcripts = tRes.data;
                    }

                    setPlayerData({
                        ...item.result_data,
                        transcripts: transcripts
                    });

                    // [New] 클립 목록 불러오기
                    fetchClips(item.filename);

                    // 기존 초기화 로직
                    setEditTitleText(item.result_data.video_title || item.result_data.video_filename);
                    setIsEditingTitle(false);
                    setShowSubtitle(true);
                    setClipTitle(""); // 클립 제목 입력 초기화

                    setViewMode('player');
                    setActiveTab('chapters');
                } catch (err) {
                    console.error(err);
                    alert("데이터 로드 실패");
                }
            };

            // [New] 제목 수정 핸들러
            const handleUpdateTitle = async () => {
                if (!editTitleText.trim()) return alert("제목을 입력해주세요.");

                try {
                    await axios.patch(`/api/history/${playerData.video_filename}`, {
                        title: editTitleText
                    });

                    // 로컬 상태 업데이트
                    setPlayerData(prev => ({ ...prev, video_title: editTitleText }));
                    setIsEditingTitle(false);
                    fetchHistory(); // 목록도 갱신
                } catch (err) {
                    alert("제목 수정 실패: " + err.message);
                }
            };

            // [추가] 안전한 클립보드 복사 핸들러
            const handleCopyFullText = async () => {
                if (!blogContent || blogContent.length === 0) return;

                const textToCopy = blogContent.map(b => `[${b.title}]\n${b.fullText}`).join('\n\n');

                try {
                    await navigator.clipboard.writeText(textToCopy);
                    alert('클립보드에 전체 내용이 복사되었습니다!');
                } catch (err) {
                    console.error('Copy failed:', err);
                    // 보안상 자동 복사가 막힌 경우를 대비한 안내
                    alert('복사에 실패했습니다.\n(보안 문제로 HTTPS 또는 localhost 환경이 필요할 수 있습니다.)');
                }
            };

            // Player Utils
            const seekVideo = (time) => {
                if (videoRef.current) {
                    videoRef.current.currentTime = time;
                    videoRef.current.play();
                }
            };
            const formatTime = (s) => {
                if (!s && s !== 0) return "0:00";
                const m = Math.floor(s / 60);
                const sec = Math.floor(s % 60);
                return `${m}:${sec < 10 ? '0' : ''}${sec}`;
            };

            // --- [New] Clip Editor Handlers ---
            const setStartToCurrent = () => {
                if (videoRef.current) {
                    const t = videoRef.current.currentTime;
                    setClipStart(t);
                    // 만약 시작 시간이 종료 시간보다 뒤라면, 종료 시간을 자동으로 10초 뒤로 설정
                    if (t >= clipEnd) setClipEnd(t + 10);
                }
            };

            const setEndToCurrent = () => {
                if (videoRef.current) {
                    const t = videoRef.current.currentTime;
                    if (t <= clipStart) {
                        alert("종료 시간은 시작 시간보다 뒤여야 합니다.");
                        return;
                    }
                    setClipEnd(t);
                }
            };

            // [Async] 클립 내보내기 핸들러 (수정됨)
            const handleExportClip = async () => {
                if (clipEnd <= clipStart) return alert("구간 설정이 올바르지 않습니다.");

                // [New] 제목 입력 확인
                const finalTitle = clipTitle.trim() || `Clip_${formatTime(clipStart)}-${formatTime(clipEnd)}`;

                setIsClipMode(false); // UI 닫기

                try {
                    await axios.post('/api/export/clip', {
                        filename: playerData.video_filename,
                        start_time: clipStart,
                        end_time: clipEnd,
                        title: finalTitle // [New] 제목 전송
                    });

                    alert("클립 생성 작업이 시작되었습니다. 완료되면 아래 보관함에 나타납니다.");
                    setClipTitle(""); // 입력창 초기화
                    fetchActiveTasks();

                } catch (err) {
                    console.error(err);
                    alert("요청 실패: " + err.message);
                }
            };
            // ----------------------------------

            // [New] AI 숏츠 생성 핸들러
            const handleAutoGenerateShorts = async () => {
                if (!confirm("AI가 이 영상의 하이라이트를 찾아 숏츠로 제작합니다.\n(약 1~2분 소요)\n\n계속하시겠습니까?")) return;

                try {
                    await axios.post('/api/shorts/auto-generate', {
                        filename: playerData.video_filename
                    });

                    alert("AI 숏츠 제작이 시작되었습니다!\n우측 하단 작업 모니터에서 진행 상황을 확인하세요.");
                    fetchActiveTasks(); // 작업 목록 갱신

                } catch (err) {
                    console.error(err);
                    alert("요청 실패: " + err.message);
                }
            };

            // [New] AI 숏츠와 일반 클립 분리 (Memoization)
            const { aiShorts, manualClips } = useMemo(() => {
                const ai = [];
                const manual = [];
                clipsList.forEach(clip => {
                    if (clip.is_ai_generated) ai.push(clip);
                    else manual.push(clip);
                });
                return { aiShorts: ai, manualClips: manual };
            }, [clipsList]);

            // [Helper] 숏츠 재생 시간(상대 시간)을 원본 영상 시간(절대 시간)으로 변환
            const getOriginalTimeFromShorts = (shortsTime, segments) => {
                if (!segments || segments.length === 0) return 0;

                let remaining = shortsTime;
                for (let seg of segments) {
                    const duration = seg.end - seg.start;
                    if (remaining <= duration) {
                        return seg.start + remaining;
                    }
                    remaining -= duration;
                }
                // 마지막 구간을 넘어가면 마지막 세그먼트의 끝으로 간주
                return segments[segments.length - 1].end;
            };

            // [State] 현재 재생 중인 숏츠의 정보 (하이라이팅용)
            const [activeShortsId, setActiveShortsId] = useState(null);
            const [currentShortsOriginalTime, setCurrentShortsOriginalTime] = useState(0);

            // [Helper] 원본 영상 시간(Original Time)을 숏츠 타임라인(Shorts Time)으로 변환
            const getShortsTimeFromOriginal = (originalTime, segments) => {
                if (!segments) return 0;

                let accumulatedDuration = 0;
                for (let seg of segments) {
                    // 목표 시간이 현재 세그먼트 내에 있는 경우
                    if (originalTime >= seg.start && originalTime <= seg.end) {
                        return accumulatedDuration + (originalTime - seg.start);
                    }
                    // 목표 시간이 현재 세그먼트보다 뒤에 있는 경우 (누적 시간 더하기)
                    accumulatedDuration += (seg.end - seg.start);
                }
                return 0; // 매칭되지 않으면 0초
            };

            // [Handler] 숏츠 스크립트 클릭 시 해당 위치로 이동
            const handleJumpToShortsScript = (e, videoId, originalTime, segments) => {
                e.stopPropagation(); // 드롭다운 토글 방지
                e.preventDefault();

                const videoEl = document.getElementById(videoId);
                if (videoEl) {
                    const targetShortsTime = getShortsTimeFromOriginal(originalTime, segments);
                    videoEl.currentTime = targetShortsTime;
                    videoEl.play();
                }
            };

            // [State] 현재 재생 중인 숏츠의 자막 텍스트
            const [currentShortsSubtitle, setCurrentShortsSubtitle] = useState("");

            // [Handler] 숏츠 타임 업데이트 핸들러 (수정됨: 하이라이팅 지원)
            const handleShortsTimeUpdate = (e, segments, clipId) => {
                if (!playerData.transcripts) return;

                const currentTime = e.target.currentTime;
                const originalTime = getOriginalTimeFromShorts(currentTime, segments);

                // 1. 오버레이 자막 업데이트
                const activeItem = playerData.transcripts.find(
                    item => originalTime >= item.start && originalTime <= item.end
                );
                setCurrentShortsSubtitle(activeItem ? activeItem.text : "");

                // 2. 하이라이팅을 위한 상태 업데이트 (불필요한 리렌더링 방지)
                // 현재 재생 중인 클립 ID와 원본 시간 저장
                if (activeShortsId !== clipId) setActiveShortsId(clipId);

                // 0.5초 단위로만 상태 업데이트 (성능 최적화)
                if (Math.abs(currentShortsOriginalTime - originalTime) > 0.5) {
                    setCurrentShortsOriginalTime(originalTime);
                }
            };

            // [New] 숏츠 스크립트 자동 스크롤을 위한 Effect
            useEffect(() => {
                // 숏츠 탭이 아니거나, 활성화된 숏츠가 없거나, 데이터가 없으면 실행하지 않음
                if (activeTab !== 'shorts' || !activeShortsId || !playerData?.transcripts) return;

                // 1. 현재 재생 중인 원본 시간(currentShortsOriginalTime)에 해당하는 스크립트 인덱스 찾기
                const activeIndex = playerData.transcripts.findIndex(
                    t => currentShortsOriginalTime >= t.start && currentShortsOriginalTime <= t.end
                );

                if (activeIndex !== -1) {
                    // 2. 해당 요소의 ID 생성 (렌더링 시 부여할 ID 규칙과 일치해야 함)
                    // 형식: shorts-script-item-{ShortsID}-{TranscriptIndex}
                    const elementId = `shorts-script-item-${activeShortsId}-${activeIndex}`;
                    const element = document.getElementById(elementId);

                    if (element) {
                        // 3. 부드럽게 스크롤 이동 (block: 'center'로 중앙 정렬)
                        element.scrollIntoView({
                            behavior: 'smooth',
                            block: 'center'
                        });
                    }
                }
            }, [currentShortsOriginalTime, activeShortsId, activeTab, playerData]);

            // --------------------------------------------------------------------------
            // [Render Helpers] 
            // 헬퍼 함수들은 반드시 return 문 이전에 정의되어야 합니다.
            // --------------------------------------------------------------------------

            // 1. Video Info & Controls (Title, Clip Editor, etc.)
            const renderVideoInfoAndControls = (isMobile = false) => (
                <div className="space-y-4 animate-fade-in">
                    {/* Toggle Subtitle Btn */}
                    {playerData.vtt_filename && (
                        <div className="flex justify-end">
                            <button onClick={() => setShowSubtitle(!showSubtitle)} className={`px-3 py-1.5 text-xs font-bold rounded-lg border flex items-center gap-2 transition ${showSubtitle ? 'bg-indigo-600 text-white border-indigo-600' : 'bg-white text-gray-600 border-gray-300 hover:bg-gray-50'}`}>
                                <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                                {showSubtitle ? '자막 끄기 (CC ON)' : '자막 켜기 (CC OFF)'}
                            </button>
                        </div>
                    )}

                    {/* Info Box */}
                    <div className="bg-gray-50 p-4 rounded-xl border border-gray-100">
                        <div className="flex items-start justify-between gap-2 mb-2">
                            {isEditingTitle ? (
                                <div className="flex-1 flex gap-2">
                                    <input type="text" className="flex-1 p-2 border border-indigo-300 rounded focus:outline-none focus:ring-2 focus:ring-indigo-500 text-lg font-bold" value={editTitleText} onChange={(e) => setEditTitleText(e.target.value)} onKeyDown={(e) => e.key === 'Enter' && handleUpdateTitle()} />
                                    <button onClick={handleUpdateTitle} className="bg-indigo-600 text-white px-3 rounded font-bold text-sm hover:bg-indigo-700">저장</button>
                                    <button onClick={() => setIsEditingTitle(false)} className="bg-gray-300 text-gray-700 px-3 rounded font-bold text-sm hover:bg-gray-400">취소</button>
                                </div>
                            ) : (
                                <h2 className="font-bold text-gray-800 text-lg leading-snug flex-1">
                                    {normalizeLegacyTitle(playerData.video_title || playerData.chapters[0]?.title || "제목 없음")}
                                </h2>
                            )}
                            {!isEditingTitle && (
                                <button onClick={() => setIsEditingTitle(true)} className="text-gray-400 hover:text-indigo-600 p-1" title="제목 수정"><svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z"></path></svg></button>
                            )}
                        </div>
                        <p className="text-sm text-gray-500">AI 분석 완료 • {playerData.total_chapters}개의 챕터</p>
                    </div>

                    {/* Clip Editor UI */}
                    <div>
                        {!isClipMode ? (
                            <button onClick={() => { setIsClipMode(true); if (videoRef.current) { const t = videoRef.current.currentTime; setClipStart(t); setClipEnd(t + 10); } }} className="w-full py-3 border-2 border-dashed border-indigo-200 rounded-xl text-indigo-500 font-bold hover:bg-indigo-50 hover:border-indigo-400 transition flex items-center justify-center gap-2">
                                <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M14.121 14.121L19 19m-7-7l7-7m-7 7l-2.879 2.879M12 12L9.121 9.121m0 5.758a3 3 0 10-4.243 4.243 3 3 0 004.243-4.243zm0-5.758a3 3 0 10-4.243-4.243 3 3 0 004.243 4.243z"></path></svg>
                                ✂️ 구간 잘라서 내보내기
                            </button>
                        ) : (
                            /* [Mobile Responsive Modal] Mobile: Fixed Modal / Desktop: Inline Block */
                            <div className="fixed inset-0 z-50 bg-black/80 flex items-center justify-center p-4 lg:p-0 lg:static lg:bg-transparent lg:block animate-fade-in">
                                <div className="bg-white border-2 border-indigo-500 rounded-xl p-5 shadow-lg w-full max-w-lg lg:max-w-none relative overflow-y-auto max-h-[90vh] lg:max-h-none">
                                    <div className="flex justify-between items-center mb-2">
                                        <h3 className="font-bold text-gray-800 flex items-center gap-2"><span className="bg-indigo-600 text-white text-xs px-2 py-1 rounded">REC</span>구간 자르기</h3>
                                        <button onClick={() => setIsClipMode(false)} className="text-gray-400 hover:text-red-500 p-1 bg-gray-100 rounded-full lg:bg-transparent"><svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M6 18L18 6M6 6l12 12"></path></svg></button>
                                    </div>

                                    {/* Timeline Visualization */}
                                    <TimelineVisualizer totalDuration={totalDuration} start={clipStart} end={clipEnd} />

                                    <div className="grid grid-cols-2 gap-4 mb-4 mt-4">
                                        <div className="bg-gray-50 p-3 rounded-xl border border-gray-200">
                                            <label className="text-xs text-gray-500 font-bold mb-1 block">시작 (Start)</label>
                                            <div className="text-xl font-mono font-bold text-indigo-600 tracking-tight mb-2">{formatTimeDetail(clipStart)}</div>
                                            <input type="number" step="0.1" className="w-full p-1.5 text-xs bg-white border border-gray-300 rounded outline-none mb-2" value={clipStart} onChange={(e) => setClipStart(parseFloat(e.target.value))} />
                                            <button onClick={setStartToCurrent} className="w-full py-1.5 bg-white border border-gray-300 rounded text-xs font-bold text-gray-600 hover:text-indigo-600 transition">📍 현재 위치</button>
                                        </div>
                                        <div className="bg-gray-50 p-3 rounded-xl border border-gray-200">
                                            <label className="text-xs text-gray-500 font-bold mb-1 block">종료 (End)</label>
                                            <div className="text-xl font-mono font-bold text-indigo-600 tracking-tight mb-2">{formatTimeDetail(clipEnd)}</div>
                                            <input type="number" step="0.1" className="w-full p-1.5 text-xs bg-white border border-gray-300 rounded outline-none mb-2" value={clipEnd} onChange={(e) => setClipEnd(parseFloat(e.target.value))} />
                                            <button onClick={setEndToCurrent} className="w-full py-1.5 bg-white border border-gray-300 rounded text-xs font-bold text-gray-600 hover:text-indigo-600 transition">📍 현재 위치</button>
                                        </div>
                                    </div>

                                    <div className="mb-4">
                                        <input type="text" placeholder="클립 제목 (선택사항)" className="w-full p-3 border border-gray-300 rounded focus:ring-2 focus:ring-indigo-500 outline-none text-sm" value={clipTitle} onChange={(e) => setClipTitle(e.target.value)} />
                                    </div>

                                    <div className="flex gap-2">
                                        <button onClick={() => { if (videoRef.current) { videoRef.current.currentTime = clipStart; videoRef.current.play(); } }} className="flex-1 py-3 bg-gray-100 text-gray-700 rounded-lg font-bold text-sm hover:bg-gray-200 flex items-center justify-center gap-1">▶ 미리보기</button>
                                        <button onClick={handleExportClip} className="flex-[2] py-3 bg-indigo-600 text-white rounded-lg font-bold text-sm hover:bg-indigo-700 shadow-md flex items-center justify-center gap-1">내보내기</button>
                                    </div>
                                </div>
                            </div>
                        )}

                        {/* Clip Library */}
                        {clipsList.length > 0 && (
                            <div className="mt-6 animate-fade-in">
                                <h3 className="font-bold text-gray-700 mb-2 flex items-center gap-2 text-sm">📂 클립 보관함 <span className="bg-gray-200 text-gray-600 text-xs px-2 py-0.5 rounded-full">{clipsList.length}</span></h3>
                                <div className="space-y-2 max-h-48 overflow-y-auto pr-1 custom-scrollbar">
                                    {clipsList.map((clip) => (
                                        <div key={clip.clip_id} className="bg-white border border-gray-200 rounded p-3 flex justify-between items-center shadow-sm hover:shadow-md transition text-sm">

                                                {historyList.map((item, idx) => (
                                                    <div key={idx}
                                                        onClick={() => loadPlayer(item)}
                                                        className="bg-white rounded-xl shadow-sm border border-gray-200 p-5 cursor-pointer hover:shadow-md hover:border-indigo-300 transition group relative overflow-hidden">

                                                        <div className="absolute top-0 left-0 w-1 h-full bg-indigo-500 opacity-0 group-hover:opacity-100 transition"></div>

                                                        <button
                                                            onClick={(e) => handleDelete(e, item.filename)}
                                                            className="absolute top-4 right-4 text-gray-300 hover:text-red-500 transition p-1 z-10">
                                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                        </button>

                                                        <div className="flex flex-col h-full">
                                                            <h4 className="font-bold text-gray-800 line-clamp-2 mb-2 group-hover:text-indigo-600 transition">
                                                                {normalizeLegacyTitle(item.title)}
                                                            </h4>
                                                            <p className="text-xs text-gray-400 mb-4">{new Date(item.timestamp * 1000).toLocaleString()}</p>

                                                            <div className="mt-auto flex justify-between items-center">
                                                                <span className="text-xs font-medium text-indigo-600 bg-indigo-50 px-2 py-1 rounded">
                                                                    {item.total_chapters} Chapters
                                                                </span>
                                                            </div>
                                                        </div>
                                                    </div>
                                                ))}
                                            </div>
                                        )}
                                    </section>
                                </div>
                            </div>
                        )}

                        {/* --- [Modified] View 2: Player (Adaptive Layout) --- */}
                        {viewMode === 'player' && playerData && (
                            <div className="w-full h-full flex flex-col lg:flex-row max-w-7xl mx-auto bg-white shadow-xl overflow-hidden relative">

                                {/* [Left Panel / Mobile Top] Video & Controls */}
                                <div className="w-full lg:w-5/12 shrink-0 flex flex-col border-b lg:border-b-0 lg:border-r border-gray-200 bg-white relative z-20 sticky top-0 lg:static">

                                    {/* Video Wrapper */}
                                    <div className="w-full bg-black relative group aspect-video lg:h-auto shrink-0">
                                        <button onClick={() => setViewMode('dashboard')} className="lg:hidden absolute top-4 left-4 z-30 bg-black/50 text-white p-2 rounded-full backdrop-blur-sm">
                                            <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
                                        </button>

                                        <video
                                            ref={videoRef}
                                            src={`/static/videos/${playerData.video_filename}`}
                                            controls
                                            playsInline
                                            crossOrigin="anonymous"
                                            className="w-full h-full object-contain"
                                            onTimeUpdate={handleTimeUpdate}
                                            onLoadedMetadata={(e) => setTotalDuration(e.target.duration)}
                                        />

                                        {showSubtitle && currentSubtitle && (
                                            <div className={`absolute left-0 w-full text-center px-4 pointer-events-none transition-all duration-300 ease-in-out z-10 bottom-8 lg:bottom-16`}>
                                                <span className="inline-block bg-black/30 text-white text-xs md:text-base px-2 py-1 rounded-lg leading-relaxed shadow-sm backdrop-blur-[2px]">
                                                    {removePunctuation(currentSubtitle)}
                                                </span>
                                            </div>
                                        )}
                                    </div>

                                    {/* Desktop Controls */}
                                    <div className="hidden lg:block flex-1 overflow-y-auto p-6 custom-scrollbar">
                                        {renderVideoInfoAndControls()}
                                    </div>
                                </div>

                                {/* [Right Panel / Mobile Bottom] Content */}
                                <div className="w-full lg:w-7/12 h-full bg-gray-50 flex flex-col overflow-hidden relative">

                                    {/* Desktop Tabs */}
                                    <div className="hidden lg:flex border-b border-gray-200 bg-white shrink-0 z-30">
                                        {renderTabButtons("flex-1 py-4 text-sm font-bold border-b-2 hover:bg-gray-50 transition")}
                                    </div>

                                    {/* Scrollable Content */}
                                    <div className="flex-1 overflow-y-auto p-4 lg:p-8 pb-24 lg:pb-0 custom-scrollbar scroll-smooth">
                                        {/* Mobile Controls */}
                                        <div className="lg:hidden mb-6 space-y-4">
                                            {renderVideoInfoAndControls(true)}
                                        </div>

                                        {renderTabContent()}
                                    </div>

                                    {/* Mobile Bottom Navigation */}
                                    <div className="lg:hidden fixed bottom-0 left-0 w-full bg-white border-t border-gray-200 z-50 pb-safe flex justify-around items-center shadow-[0_-4px_6px_-1px_rgba(0,0,0,0.05)]">
                                        <button onClick={() => setActiveTab('shorts')} className={`flex flex-col items-center p-3 w-1/4 ${activeTab === 'shorts' ? 'mobile-tab-active' : 'text-gray-400'}`}>
                                            <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M13 10V3L4 14h7v7l9-11h-7z"></path></svg>
                                            <span className="text-[10px] font-bold">AI 숏츠</span>
                                        </button>
                                        <button onClick={() => setActiveTab('chapters')} className={`flex flex-col items-center p-3 w-1/4 ${activeTab === 'chapters' ? 'mobile-tab-active' : 'text-gray-400'}`}>
                                            <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2"></path></svg>
                                            <span className="text-[10px] font-bold">요약</span>
                                        </button>
                                        <button onClick={() => setActiveTab('blog')} className={`flex flex-col items-center p-3 w-1/4 ${activeTab === 'blog' ? 'mobile-tab-active' : 'text-gray-400'}`}>
                                            <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path></svg>
                                            <span className="text-[10px] font-bold">블로그</span>
                                        </button>
                                        <button onClick={() => setActiveTab('transcript')} className={`flex flex-col items-center p-3 w-1/4 ${activeTab === 'transcript' ? 'mobile-tab-active' : 'text-gray-400'}`}>
                                            <svg className="w-6 h-6 mb-1" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 10h.01M12 10h.01M16 10h.01M9 16H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-5l-5 5v-5z"></path></svg>
                                            <span className="text-[10px] font-bold">대본</span>
                                        </button>
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
