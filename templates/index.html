                                                                                <div className="flex flex-wrap gap-2 mt-2">
                                                                                    {clip.segments && clip.segments.map((seg, sIdx) => (
                                                                                        <span key={sIdx} className="text-xs font-mono bg-gray-100 text-gray-600 px-2 py-0.5 rounded border border-gray-200">
                                                                                            {formatTime(seg.start)}~{formatTime(seg.end)}
                                                                                        </span>
                                                                                    ))}
                                                                                    <span className="text-xs font-bold text-indigo-500 self-center">
                                                                                        총 {clip.duration ? clip.duration.toFixed(1) : 0}초
                                                                                    </span>
                                                                                </div>
                                                                            </div>

                                                                            <div className="flex gap-2 shrink-0 ml-4">
                                                                                {/* [Add] 프리미어 프로 XML 버튼 */}
                                                                                <button 
                                                                                    onClick={(e) => handleExportPremiere(e, safeId)}
                                                                                    className="px-3 py-2 bg-purple-600 text-white rounded-lg hover:bg-purple-700 transition font-bold text-sm flex items-center gap-1 shadow-sm"
                                                                                    title="프리미어 프로용 시퀀스(XML) 다운로드"
                                                                                >
                                                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M8 7H5a2 2 0 00-2 2v9a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2h-3m-1 4l-3 3m0 0l-3-3m3 3V4"></path></svg>
                                                                                    XML
                                                                                </button>
                                                                                <a href={clip.download_url} download className="px-3 py-2 bg-indigo-600 text-white rounded-lg hover:bg-indigo-700 transition font-bold text-sm flex items-center gap-1 shadow-sm">
                                                                                    <svg className="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4"></path></svg>
                                                                                    영상+자막 다운
                                                                                </a>
                                                                                <button onClick={(e) => { e.preventDefault(); handleDeleteClip(safeId); }} className="p-2 text-gray-300 hover:text-red-500 hover:bg-red-50 rounded-lg transition">
                                                                                    <svg className="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path></svg>
                                                                                </button>
                                                                            </div>
                                                                        </summary>

                                                                        <div className="p-5 border-t border-gray-100 bg-gray-50/50 flex flex-col gap-6 animate-fade-in">

                                                                            {/* 1. Top: Video Area (with Custom Overlay) */}
                                                                            <div className="w-full bg-black rounded-xl overflow-hidden shadow-lg relative flex justify-center bg-zinc-900 group">
                                                                                {clip.preview_url ? (
                                                                                    <>
                                                                                        <video
                                                                                            id={videoElementId} /* 비디오 엘리먼트 ID 할당 */
                                                                                            controls
                                                                                            crossOrigin="anonymous"
                                                                                            className="w-full max-h-[500px] object-contain"
                                                                                            /* 하이라이팅을 위해 uniqueKey(ID)를 함께 전달 */
                                                                                            onTimeUpdate={(e) => handleShortsTimeUpdate(e, clip.segments, uniqueKey)}
                                                                                            onPlay={() => {
                                                                                                setCurrentShortsSubtitle("");
                                                                                                setActiveShortsId(uniqueKey); // 재생 시작 시 활성 ID 설정
                                                                                            }}
                                                                                        >
                                                                                            <source src={clip.preview_url} type="video/mp4" />
                                                                                            {clip.filename_vtt && (
                                                                                                <track
                                                                                                    kind="subtitles"
                                                                                                    src={`/static/clips/${clip.filename_vtt}`}
                                                                                                    srcLang="ko"
                                                                                                    label="한국어"
                                                                                                />
                                                                                            )}
                                                                                        </video>

                                                                                        {/* Custom Subtitle Overlay */}
                                                                                        {currentShortsSubtitle && (
                                                                                            <div className="absolute left-0 w-full text-center px-4 pointer-events-none transition-all duration-300 ease-in-out z-20 bottom-4 group-hover:bottom-16">
                                                                                                <span className="inline-block bg-black/30 text-white text-xs md:text-base px-1 py-0.25 rounded-lg leading-relaxed shadow-sm">
                                                                                                    {removePunctuation(currentShortsSubtitle)}
                                                                                                </span>
                                                                                            </div>
                                                                                        )}
                                                                                    </>
                                                                                ) : (
                                                                                    <div className="flex items-center justify-center h-64 w-full text-gray-500 text-sm">
                                                                                        미리보기 파일 없음
                                                                                    </div>
                                                                                )}
                                                                            </div>

                                                                            {/* 2. Bottom: Split Info Area */}
                                                                            <div className="flex flex-col lg:flex-row gap-6">
                                                                                {/* Left: Reason */}
                                                                                <div className="w-full lg:w-1/2 flex flex-col">
                                                                                    <h5 className="font-bold text-indigo-800 mb-2 flex items-center gap-1 text-sm">
                                                                                        💡 AI 선정 이유
                                                                                    </h5>
                                                                                    <div className="bg-white p-4 rounded-xl border border-indigo-100 shadow-sm flex-1">
                                                                                        <p className="text-sm text-gray-700 leading-relaxed">
                                                                                            {clip.reason}
                                                                                        </p>
                                                                                    </div>
                                                                                </div>

                                                                                {/* Right: Script (클릭 이동 & 하이라이트 & 자동 스크롤 기능 추가) */}
                                                                                <div className="w-full lg:w-1/2 flex flex-col">
                                                                                    <h5 className="font-bold text-gray-700 mb-2 text-sm">
                                                                                        📜 포함된 스크립트 내용 (클릭하여 이동)
                                                                                    </h5>
                                                                                    <div className="bg-white p-2 rounded-xl border border-gray-200 text-sm h-48 overflow-y-auto custom-scrollbar leading-relaxed">
                                                                                        {playerData.transcripts ? (
                                                                                            playerData.transcripts
                                                                                                .filter(t => clip.segments && clip.segments.some(seg => t.start >= seg.start && t.start < seg.end))
                                                                                                .map((t, i) => {
                                                                                                    // 실제 transcript 배열 내의 원본 index를 찾아야 id 매칭이 정확함
                                                                                                    const originalIndex = playerData.transcripts.indexOf(t);

                                                                                                    // 하이라이트 로직
                                                                                                    const isActive = activeShortsId === uniqueKey &&
                                                                                                        currentShortsOriginalTime >= t.start &&
                                                                                                        currentShortsOriginalTime <= t.end;

                                                                                                    return (
                                                                                                        <div
                                                                                                            key={i}
                                                                                                            // [수정] 자동 스크롤을 위한 ID 부여 (형식: shorts-script-item-{ShortsID}-{TranscriptIndex})
                                                                                                            id={`shorts-script-item-${uniqueKey}-${originalIndex}`}
                                                                                                            // 클릭 시 숏츠 타임라인상 위치를 계산하여 비디오 이동
                                                                                                            onClick={(e) => handleJumpToShortsScript(e, videoElementId, t.start, clip.segments)}
                                                                                                            className={`p-2 rounded-lg cursor-pointer transition mb-1 flex gap-2 ${isActive
                                                                                                                ? 'bg-indigo-50 border border-indigo-200 text-indigo-900 shadow-sm scroll-mt-10'
                                                                                                                : 'hover:bg-gray-50 text-gray-600 border border-transparent'
                                                                                                                }`}
                                                                                                        >
                                                                                                            <span className={`text-xs font-mono whitespace-nowrap mt-0.5 ${isActive ? 'text-indigo-600 font-bold' : 'text-indigo-300'}`}>
                                                                                                                {formatTime(t.start)}
                                                                                                            </span>
                                                                                                            <p className={`${isActive ? 'font-medium' : ''}`}>
                                                                                                                {t.text}
                                                                                                            </p>
                                                                                                        </div>
                                                                                                    );
                                                                                                })
                                                                                        ) : (
                                                                                            <p className="text-gray-400 italic p-4">스크립트 정보를 불러올 수 없습니다.</p>
                                                                                        )}
                                                                                    </div>
                                                                                </div>
                                                                            </div>
                                                                        </div>
                                                                    </details>
                                                                );
                                                            })}
                                                        </div>
                                                    )}
                                                </div>
                                            </div>
                                        )}
                                        {/* Chapter List */}
                                        {activeTab === 'chapters' && (
                                            <div className="space-y-4 pb-10">
                                                {playerData.chapters.map((chap, idx) => {
                                                    const isExpanded = expandedChapters[idx];
                                                    return (
                                                        <div key={idx} className="group bg-white rounded-xl border border-gray-200 hover:border-indigo-300 transition overflow-hidden shadow-sm">
                                                            {/* Header Area (Click to Toggle) */}
                                                            <div
                                                                onClick={() => toggleChapter(idx)}
                                                                className="p-4 flex gap-3 items-start cursor-pointer bg-white hover:bg-gray-50 transition select-none"
                                                            >
                                                                {/* 재생 버튼 */}
                                                                <button
                                                                    onClick={(e) => { e.stopPropagation(); seekVideo(chap.time.start); }}
                                                                    className="shrink-0 mt-0.5 px-2 py-1 bg-indigo-50 text-indigo-600 text-xs font-mono font-bold rounded hover:bg-indigo-600 hover:text-white transition flex items-center gap-1 z-10 border border-indigo-100"
                                                                >
                                                                    ▶ {formatTime(chap.time.start)}
                                                                </button>

                                                                <div className="flex-1">
                                                                    <div className="flex justify-between items-center gap-4">
                                                                        <h3 className={`text-base font-bold transition leading-relaxed ${isExpanded ? 'text-indigo-700' : 'text-gray-700'}`}>
                                                                            {chap.title}
                                                                        </h3>
                                                                        {/* Chevron Icon */}
                                                                        <svg
                                                                            className={`w-5 h-5 text-gray-400 transform transition-transform duration-300 shrink-0 ${isExpanded ? 'rotate-180' : ''}`}
                                                                            fill="none" stroke="currentColor" viewBox="0 0 24 24"
                                                                        >
                                                                            <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M19 9l-7 7-7-7"></path>
                                                                        </svg>
                                                                    </div>

                                                                    {/* 접혔을 때 보이는 한 줄 요약 */}
                                                                    {!isExpanded && (
                                                                        <p className="text-xs text-gray-400 mt-1 line-clamp-1">
                                                                            {chap.summary.replace(/\n/g, ' ')}
                                                                        </p>
                                                                    )}
                                                                </div>
                                                            </div>

                                                            {/* Body Area (Content) */}
                                                            {isExpanded && (
                                                                <div className="px-4 pb-4 pl-[4.5rem] animate-fade-in border-t border-gray-50">
                                                                    <div className="text-gray-600 text-sm leading-7 mt-2">
                                                                        {chap.summary.split('\n').map((line, i) => (<p key={i} className="mb-1">{line}</p>))}
                                                                    </div>
                                                                </div>
                                                            )}
                                                        </div>
                                                    );
                                                })}
                                            </div>
                                        )}

                                        {/* [수정] Tab 2: Blog View (Markdown Rendered) */}
                                        {activeTab === 'blog' && (
                                            <div className="max-w-3xl mx-auto pb-20 animate-fade-in px-4">
                                                <div className="mb-8 text-center border-b border-gray-100 pb-6 pt-4">
                                                    {/* [Modified] 블로그 뷰 상단 제목도 정규화 적용 */}
                                                    <h2 className="text-xl md:text-2xl font-bold text-gray-900 mb-2">
                                                        {normalizeLegacyTitle(playerData.video_title)}
                                                    </h2>
                                                    <p className="text-xs text-indigo-500 font-bold uppercase tracking-wide flex items-center justify-center gap-2">
                                                        Refined by AI
                                                        <button
                                                            onClick={handleRegenerateBlog}
                                                            className="ml-2 p-1.5 bg-indigo-50 text-indigo-600 rounded-full hover:bg-indigo-600 hover:text-white transition shadow-sm border border-indigo-100 group/btn"
                                                            title="블로그 내용 재생성 (AI 다시 작성)"
                                                        >
                                                            <svg className="w-3.5 h-3.5 group-active/btn:animate-spin" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                                                <path strokeLinecap="round" strokeLinejoin="round" strokeWidth="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                                                            </svg>
                                                        </button>
                                                    </p>
                                                </div>

                                                <div className="space-y-12">
                                                    {playerData.chapters.map((chapter, idx) => (
                                                        <article key={idx} className="group border-b border-gray-100 pb-10 last:border-0">
                                                            <div className="flex items-center gap-3 mb-6">
                                                                <button
                                                                    onClick={() => seekVideo(chapter.time.start)}
                                                                    className="shrink-0 px-2.5 py-1 bg-gray-100 text-gray-500 text-xs font-mono rounded-lg hover:bg-indigo-600 hover:text-white transition flex items-center gap-1.5 border border-gray-200"
                                                                    title="이 구간 영상 재생"
                                                                >
                                                                    ▶ {formatTime(chapter.time.start)}
                                                                </button>
                                                                {/* 챕터 제목은 Markdown 내에 포함될 수도 있지만, UI 일관성을 위해 여기서도 표시 */}
                                                                <span className="text-sm text-gray-400 font-medium">Chapter {idx + 1}</span>
                                                            </div>

                                                            {/* [핵심 변경] Markdown 렌더링 영역 + 타임스탬프 파싱 */}
                                                            {chapter.blog_content ? (
                                                                <div
                                                                    className="markdown-body prose-custom"
                                                                    dangerouslySetInnerHTML={{ 
                                                                        __html: (() => {
                                                                            // 1. 먼저 마크다운을 HTML로 변환
                                                                            let html = marked.parse(chapter.blog_content);
                                                                            
                                                                            // 2. HTML 내에서 [MM:SS] 또는 [M:SS] 패턴을 찾아 버튼으로 치환
                                                                            // 정규식: \[(\d{1,2}):(\d{2})\]
                                                                            html = html.replace(/\[(\d{1,2}):(\d{2})\]/g, (match, min, sec) => {
                                                                                const totalSeconds = parseInt(min) * 60 + parseInt(sec);
                                                                                return `<span class="timestamp-link" onclick="window.seekFromTimestamp(${totalSeconds})">${min}:${sec}</span>`;
                                                                            });
                                                                            
                                                                            return html;
                                                                        })()
                                                                    }}
                                                                />
                                                            ) : (
                                                                // 하위 호환성: blog_content가 없는 구버전 데이터는 기존 방식대로 표시
                                                                <div>
                                                                    <h3 className="text-lg font-bold text-gray-800 mb-2">{chapter.title}</h3>
                                                                    <p className="bg-indigo-50/60 p-4 rounded-lg text-indigo-900 mb-4 font-medium">
                                                                        💡 {chapter.summary}
                                                                    </p>
                                                                    <p className="text-gray-700 leading-7">
                                                                        (아직 윤문 데이터가 생성되지 않았습니다. 분석을 다시 실행하면 Gemma가 글을 작성해줍니다.)
                                                                    </p>
                                                                </div>
                                                            )}
                                                        </article>
                                                    ))}
                                                </div>

                                                {/* 전체 복사 버튼 */}
                                                <div className="mt-16 p-8 bg-gray-50 rounded-2xl text-center border border-gray-100">
                                                    <button
                                                        onClick={async () => {
                                                            // Markdown 원본 텍스트를 모두 합쳐서 복사
                                                            const fullText = playerData.chapters.map(c => c.blog_content || c.title + "\n" + c.summary).join("\n\n---\n\n");
                                                            try {
                                                                await navigator.clipboard.writeText(fullText);
                                                                alert('전체 마크다운 내용이 복사되었습니다!');
                                                            } catch (e) { alert('복사 실패'); }
                                                        }}
                                                        className="px-5 py-2.5 bg-white border border-gray-200 shadow-sm rounded-xl text-sm font-bold text-gray-700 hover:text-indigo-600 hover:border-indigo-200 transition"
                                                    >
                                                        📋 마크다운 원본 복사하기
                                                    </button>
                                                </div>
                                            </div>
                                        )}
                                        {/* [추가 끝] */}

                                        {/* Transcript List (Auto Scroll & Highlight) */}
                                        {activeTab === 'transcript' && (
                                            <div className="space-y-2 pb-10">
                                                {playerData.transcripts && playerData.transcripts.length > 0 ? (
                                                    playerData.transcripts.map((line, idx) => (
                                                        <div
                                                            key={idx}
                                                            ref={el => itemRefs.current[idx] = el}
                                                            onClick={() => seekVideo(line.start)}
                                                            className={`flex gap-4 p-4 rounded-xl transition cursor-pointer items-baseline border-l-4 ${activeIndex === idx
                                                                ? 'bg-white border-indigo-500 shadow-md ring-1 ring-indigo-100 scroll-mt-24'
                                                                : 'border-transparent hover:bg-white hover:shadow-sm text-gray-500'
                                                                }`}
                                                        >
                                                            <span className={`text-xs font-mono w-14 shrink-0 text-right ${activeIndex === idx ? 'text-indigo-600 font-bold' : 'text-gray-400'}`}>
                                                                {formatTime(line.start)}
                                                            </span>
                                                            <p className={`text-sm leading-relaxed flex-1 ${activeIndex === idx ? 'text-gray-900 font-bold' : ''}`}>
                                                                {removePunctuation(line.text)}
                                                            </p>
                                                        </div>
                                                    ))
                                                ) : (
                                                    <div className="text-center py-20 text-gray-400 bg-gray-50 rounded-xl border border-dashed border-gray-200">
                                                        <p>불러온 대본 데이터가 없습니다.</p>
                                                    </div>
                                                )}
                                            </div>
                                        )}
                                    </div>
                                </div>
                            </div>
                        )}
                    </main>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>

</html>
